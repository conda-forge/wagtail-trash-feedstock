# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: wagtail-trash
  version: "3.3.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 6d482ab645a765e16e9e904ac361cf86d39ae9e509090d61494fd3f7c3930405

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - wheel
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<4.0
    - wagtail >=7.4
    - wagtail-modeladmin >=2.5
tests:
  - python:
      imports:
        - wagtail_trash
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Make deleted pages only temporarily deleted.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Frojd/wagtail-trash/

extra:
  recipe-maintainers:
    - rxm7706
